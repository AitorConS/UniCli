name: Kernel Build

# Builds and validates the kernel toolset when kernel/ changes. It no longer
# publishes anywhere: distribution is via the R2 signed manifest, and the kernel
# component there is carried forward by main.yml's publish-r2 job (the artifacts,
# including kernel-fc.img which no workflow rebuilds, already live in R2 under
# kernel/<ver>/). Cutting a NEW kernel version to R2 — including regenerating
# kernel-fc.img — is a manual/future step tracked in roadmap.md Phase 7.

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate kernel artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib nasm qemu-utils

      - name: Build kernel and mkfs
        run: make kernel && make -C kernel tools

      - name: Stage artifacts
        run: |
          mkdir -p dist
          test -f kernel/output/tools/bin/mkfs \
            || (echo "ERROR: mkfs not built" && exit 1)
          test -f kernel/output/tools/bin/dump \
            || (echo "ERROR: dump not built" && exit 1)
          test -f kernel/output/platform/pc/bin/kernel.img \
            || (echo "ERROR: kernel.img not built" && exit 1)
          test -f kernel/output/platform/pc/boot/boot.img \
            || (echo "ERROR: boot.img not built" && exit 1)
          cp kernel/output/tools/bin/mkfs             dist/mkfs-linux-amd64
          cp kernel/output/tools/bin/dump             dist/dump-linux-amd64
          cp kernel/output/platform/pc/bin/kernel.img dist/kernel.img
          cp kernel/output/platform/pc/boot/boot.img  dist/boot.img
          chmod +x dist/mkfs-linux-amd64 dist/dump-linux-amd64
          VERSION="v$(cat kernel/VERSION | tr -d '[:space:]')"
          echo "$VERSION" > dist/kernel-version.txt
          file dist/mkfs-linux-amd64 dist/dump-linux-amd64 dist/kernel.img dist/boot.img

      - name: Upload kernel artifacts (build validation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-artifacts
          path: dist/
